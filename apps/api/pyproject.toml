[project]
name = "vedax-api"
version = "0.1.0"
description = "VedaX AI - Multimodal Agentic Knowledge & Analysis Platform API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "motor>=3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "PyJWT>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.17",
    "httpx>=0.27",
    "openai>=1.55",
    "cloudinary>=1.41",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "Pillow>=11.0",
    "langchain-core>=0.3.29",
    "langgraph>=0.2.60",
    "langfuse>=3.0",
]

[project.optional-dependencies]
local-embeddings = ["sentence-transformers>=3.3"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "mongomock-motor>=0.0.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
