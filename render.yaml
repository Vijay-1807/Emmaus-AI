services:
  - type: web
    name: emmaus-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: apps/api
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: vedax
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://emmaus-ai.vercel.app,http://localhost:3000,http://127.0.0.1:3000
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_BASE_URL
        value: https://ollama.com/v1
      - key: GROQ_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: jina
      - key: EMBEDDING_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: jina-embeddings-v5-omni-small
      - key: EMBEDDING_DIMENSIONS
        value: "1024"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: MEDIA_STORAGE
        value: cloudinary
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_IMAGE_MODEL
        value: "@cf/black-forest-labs/flux-1-schnell"
    healthCheckPath: /api/health
    autoDeploy: true

  - type: worker
    name: emmaus-worker
    runtime: docker
    dockerfilePath: apps/api/Dockerfile.worker
    dockerContext: apps/api
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: vedax
      - key: SECRET_KEY
        generateValue: true
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_BASE_URL
        value: https://ollama.com/v1
      - key: GROQ_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: jina
      - key: EMBEDDING_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: jina-embeddings-v5-omni-small
      - key: EMBEDDING_DIMENSIONS
        value: "1024"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: MEDIA_STORAGE
        value: cloudinary
    autoDeploy: true
